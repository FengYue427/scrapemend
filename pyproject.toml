[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapemend"
version = "0.0.2"
description = "Self-healing web scraping for Python. Describe what you want in plain language; when a site changes and your selectors break, an LLM repairs them automatically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FengYue427" }]
keywords = [
    "scraping",
    "web-scraping",
    "crawler",
    "llm",
    "ai",
    "self-healing",
    "data-extraction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/FengYue427/scrapemend"
Repository = "https://github.com/FengYue427/scrapemend"
Issues = "https://github.com/FengYue427/scrapemend/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapemend"]

[tool.ruff]
line-length = 100
target-version = "py310"
